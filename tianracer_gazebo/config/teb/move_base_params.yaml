shutdown_costmaps: false #当move_base在不活动状态时,是否关掉costmap

#阿克曼车无法原地旋转。必须关掉 move_base 的"原地清障旋转"恢复行为，
#否则局部规划失败时会下发纯角速度指令，车只会前轮空转、白等 3 秒（表现为"很慢"）
clearing_rotation_allowed: false

controller_frequency: 10.0 #向底盘控制移动话题cmd_vel发送命令的频率. 15 Hz 时 TEB 常来不及在 66 ms 内求解完，控制器报失败会造成一卡一卡；10 Hz 更稳
controller_patience: 3.0

planner_frequency: 0.5
planner_patience: 5.0

#机器人必须移动多远（以米计）才能被视为不摆动。
#如果出现摆动则说明全局规划失败，那么将在超时后执行恢复模块
oscillation_timeout: 10.0
oscillation_distance: 0.1

conservative_reset_dist: 0.1

